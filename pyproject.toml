[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "load-test-tool"
version = "0.4.0"
description = "CLI e interfaz Tkinter para escenarios de estrés HTTP y visualización de resultados"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Equipo de Ingeniería"}]
license = {text = "MIT"}

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]

[project.scripts]
loadtest = "loadtest.cli:main"
loadtest-gui = "loadtest.gui:main"

[tool.setuptools.packages.find]
include = ["loadtest*"]
