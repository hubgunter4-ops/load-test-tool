  <text x="72" y="178" font-family="Arial, sans-serif" font-size="12" fill="#475569">URL</text>
  <rect x="72" y="188" width="574" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="84" y="210" font-family="Arial, sans-serif" font-size="13" fill="#334155">http://localhost:8000/health</text>
  <text x="72" y="252" font-family="Arial, sans-serif" font-size="12" fill="#475569">Método</text>
  <rect x="72" y="262" width="112" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="84" y="284" font-family="Arial, sans-serif" font-size="13" fill="#334155">GET        ▾</text>
  <text x="212" y="252" font-family="Arial, sans-serif" font-size="12" fill="#475569">Usuarios</text>
  <rect x="212" y="262" width="130" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="224" y="284" font-family="Arial, sans-serif" font-size="13" fill="#334155">25</text>
  <text x="370" y="252" font-family="Arial, sans-serif" font-size="12" fill="#475569">Duración (s)</text>
  <rect x="370" y="262" width="130" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="382" y="284" font-family="Arial, sans-serif" font-size="13" fill="#334155">60</text>
  <text x="528" y="252" font-family="Arial, sans-serif" font-size="12" fill="#475569">Rampa (s)</text>
  <rect x="528" y="262" width="118" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="540" y="284" font-family="Arial, sans-serif" font-size="13" fill="#334155">15</text>
  <text x="54" y="407" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#25324b">2. Petición</text>
  <rect x="54" y="422" width="610" height="205" rx="8" fill="#fbfcfd" stroke="#d8dee9"/>
  <text x="72" y="450" font-family="Arial, sans-serif" font-size="12" fill="#475569">Cabeceras (una por línea: Nombre: valor)</text>
  <rect x="72" y="460" width="574" height="58" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="84" y="484" font-family="Arial, sans-serif" font-size="12" fill="#334155">Content-Type: application/json</text>
  <text x="84" y="504" font-family="Arial, sans-serif" font-size="12" fill="#334155">Authorization: Bearer token</text>
  <text x="72" y="550" font-family="Arial, sans-serif" font-size="12" fill="#475569">Cuerpo de la petición (opcional)</text>
  <rect x="72" y="560" width="574" height="48" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="84" y="589" font-family="Arial, sans-serif" font-size="12" fill="#334155">{"query":"SELECT 1"}</text>
  <rect x="54" y="662" width="176" height="38" rx="6" fill="#2563eb"/>
  <text x="76" y="687" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">▶  Iniciar prueba</text>
  <rect x="240" y="662" width="106" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
