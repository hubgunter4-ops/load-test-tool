  <rect x="730" y="272" width="634" height="72" rx="8" fill="#fbfcfd" stroke="#d8dee9"/>
  <text x="750" y="302" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Solicitudes</text><text x="750" y="326" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">1,284</text>
  <text x="910" y="302" font-family="Arial, sans-serif" font-size="12" fill="#64748b">RPS</text><text x="910" y="326" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">42.8</text>
  <text x="1050" y="302" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Errores</text><text x="1050" y="326" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#dc2626">3 (0.23%)</text>
  <text x="1230" y="302" font-family="Arial, sans-serif" font-size="12" fill="#64748b">p95</text><text x="1230" y="326" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">18.4 ms</text>
  <text x="730" y="377" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#25324b">Dashboard de ejecución</text>
  <rect x="730" y="392" width="634" height="218" rx="8" fill="#ffffff" stroke="#d8dee9"/>
