  <polyline points="750,540 790,530 830,545 870,500 910,515 950,470 990,488 1030,455 1070,475 1100,450" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="750" y="590" font-family="Arial, sans-serif" font-size="10" fill="#64748b">última: 14.2 ms</text>
  <text x="1130" y="455" font-family="Arial, sans-serif" font-size="11" fill="#475569">200</text><rect x="1170" y="444" width="155" height="18" rx="3" fill="#16a34a"/><text x="1332" y="458" font-family="Arial, sans-serif" font-size="11" fill="#475569">1,281</text>
  <text x="1130" y="493" font-family="Arial, sans-serif" font-size="11" fill="#475569">500</text><rect x="1170" y="482" width="9" height="18" rx="3" fill="#dc2626"/><text x="1187" y="496" font-family="Arial, sans-serif" font-size="11" fill="#475569">3</text>
  <text x="730" y="651" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#25324b">Informe final</text>
  <rect x="730" y="666" width="634" height="90" rx="8" fill="#f7f7f7" stroke="#d8dee9"/>
  <text x="750" y="692" font-family="monospace" font-size="11" fill="#475569">{ "total_requests": 1284, "successful_requests": 1281,</text>
  <text x="750" y="712" font-family="monospace" font-size="11" fill="#475569">  "requests_per_second": 42.8, "error_rate_percent": 0.23 }</text>
  <text x="730" y="798" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#25324b">Registro</text>
  <rect x="730" y="810" width="634" height="35" rx="8" fill="#f7f7f7" stroke="#d8dee9"/>
  <text x="750" y="833" font-family="monospace" font-size="11" fill="#64748b">HTTP 200 · 14.2 ms  ·  HTTP 200 · 11.8 ms  ·  HTTP 500 · 22.4 ms</text>
