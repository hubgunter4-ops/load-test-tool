<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Vista previa del dashboard de Load Test Tool</title>
  <desc id="desc">Interfaz de escritorio con configuración a la izquierda y dashboard de ejecución a la derecha.</desc>
  <rect width="1440" height="900" fill="#f4f6f8"/>
  <rect x="28" y="24" width="1384" height="852" rx="12" fill="#ffffff" stroke="#d8dee9"/>
  <text x="54" y="66" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172033">Pruebas de carga</text>
  <text x="54" y="94" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Configura el escenario, ejecútalo en segundo plano y revisa el informe visual.</text>
  <line x1="700" y1="122" x2="700" y2="842" stroke="#e2e8f0"/>
  <text x="54" y="135" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#25324b">1. Endpoint y concurrencia</text>
